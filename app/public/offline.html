<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#b45309" />
    <title>Offline — AssanPay Console</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #faf7f1; color: #292524; font: 16px system-ui, sans-serif; }
      main { width: min(100% - 2rem, 28rem); padding: 2rem; border: 1px solid #e7ded0; border-radius: 1rem; background: white; }
      h1 { margin: 0 0 .5rem; font-size: 1.3rem; }
      p { line-height: 1.5; color: #57534e; }
      button { min-height: 44px; padding: .6rem 1rem; border: 0; border-radius: .6rem; background: #b45309; color: white; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>AssanPay Console is offline</h1>
      <p>Connect to the internet to sign in, send requests, and inspect responses. No transaction data is stored for offline use.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
